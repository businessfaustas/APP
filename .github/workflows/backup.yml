name: Database backup

# Daily encrypted dump of the production database, kept 30 days as a workflow artifact, plus a
# weekly restore test that loads the dump into a throwaway Postgres and compares every table.
# Needs two repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   BACKUP_DATABASE_URL   the direct (non-pooled) connection string, ideally for a read-only role
#   BACKUP_PASSPHRASE     encrypts the dump (AES-256); store a copy in your password manager
# Without them this workflow does nothing. Your database provider's own backups (Supabase daily
# backups / point-in-time recovery, Neon history) are the first line; this is the independent copy.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SECRETS: ${{ secrets.BACKUP_DATABASE_URL != '' && secrets.BACKUP_PASSPHRASE != '' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - uses: pnpm/action-setup@v4
        if: env.HAS_SECRETS == 'true'
      - uses: actions/setup-node@v7
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.HAS_SECRETS == 'true'
      - name: Install the PostgreSQL client that matches the production server
        if: env.HAS_SECRETS == 'true'
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          major=$(psql "$BACKUP_DATABASE_URL" -Atc "SHOW server_version_num" | cut -c1-2)
          bash scripts/ci/install-pg-client.sh "$major"
      - name: Dump and encrypt
        if: env.HAS_SECRETS == 'true'
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: node scripts/db-backup.mjs "flagbid-$(date -u +%F).dump"
      - uses: actions/upload-artifact@v4
        if: env.HAS_SECRETS == 'true'
        with:
          name: db-backup-${{ github.run_id }}
          path: "*.dump.gpg"
          retention-days: 30
          if-no-files-found: error

  restore-test:
    # Sundays (and on demand): prove a backup can actually be restored.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: backup
    env:
      HAS_SECRETS: ${{ secrets.BACKUP_DATABASE_URL != '' }}
    steps:
      - name: Only on Sundays unless run by hand
        if: env.HAS_SECRETS == 'true'
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(date -u +%u)" != "7" ]; then echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true' && env.SKIP != '1'
      - uses: pnpm/action-setup@v4
        if: env.HAS_SECRETS == 'true' && env.SKIP != '1'
      - uses: actions/setup-node@v7
        if: env.HAS_SECRETS == 'true' && env.SKIP != '1'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.HAS_SECRETS == 'true' && env.SKIP != '1'
      - name: Start a scratch Postgres of the same major version as production
        if: env.HAS_SECRETS == 'true' && env.SKIP != '1'
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          major=$(psql "$BACKUP_DATABASE_URL" -Atc "SHOW server_version_num" | cut -c1-2)
          echo "MAJOR=$major" >> "$GITHUB_ENV"
          bash scripts/ci/install-pg-client.sh "$major"
          docker rm -f scratch-pg >/dev/null 2>&1 || true
          docker run -d --name scratch-pg -e POSTGRES_PASSWORD=postgres -p 5433:5432 "postgres:${major}"
          for i in $(seq 1 30); do pg_isready -h localhost -p 5433 -U postgres && break; sleep 2; done
      - name: Restore into a scratch database and compare every table
        if: env.HAS_SECRETS == 'true' && env.SKIP != '1'
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          RESTORE_ADMIN_URL: postgresql://postgres:postgres@localhost:5433/postgres
        run: pnpm exec tsx scripts/db-restore-test.mjs
