name: Post-deploy smoke test

# Vercel reports each finished deployment to GitHub. This reads the live site (never signs in or
# changes anything) and, if it is broken, alerts you and opens an issue with the rollback steps.
# GitHub only runs deployment_status workflows from the repository's default branch, so this
# starts working once it has been merged there.
on: deployment_status

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Production is tested through its public domain (set the repository variable PRODUCTION_URL); previews and the
      # per-deployment address are behind Vercel Deployment Protection unless the bypass secret below is set.
      E2E_BASE_URL: ${{ (contains(github.event.deployment_status.environment, 'Production') && vars.PRODUCTION_URL) || github.event.deployment_status.environment_url }}
      # Lets the test reach a preview protected by Vercel Authentication (Vercel → Settings → Deployment Protection).
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      # /api/health is public, so a 401 from it means Vercel Deployment Protection (not our app) is answering. Say so
      # plainly and stand down instead of reporting a broken deploy that nobody can actually see from here.
      - name: Can the test reach the app?
        id: reach
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" "${E2E_BASE_URL%/}/api/health" || echo 000)
          echo "GET ${E2E_BASE_URL%/}/api/health -> ${code}"
          if [ "$code" = "401" ] || [ "$code" = "403" ]; then
            echo "::warning title=Smoke test skipped::${E2E_BASE_URL} is behind Vercel Deployment Protection, so this check could not see the app. Set the repository variable PRODUCTION_URL to your public domain (and, for previews, the secret VERCEL_AUTOMATION_BYPASS_SECRET). See docs/LAUNCH-PLAN.md."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.reach.outputs.skip != 'true'
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: pnpm/action-setup@v6
        if: steps.reach.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.reach.outputs.skip != 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.reach.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.reach.outputs.skip != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke tests against ${{ github.event.deployment_status.environment_url }}
        if: steps.reach.outputs.skip != 'true'
        run: pnpm test:smoke

      - name: Tell someone, with the way back
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          URL: ${{ github.event.deployment_status.environment_url }}
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          gh label create deploy-failed --color B60205 --description "A deploy failed its smoke test" 2>/dev/null || true
          body="Smoke tests failed on **${ENVIRONMENT}** (${URL}) for commit ${SHA:0:7}.

          **Roll back now:** Vercel → your project → Deployments → find the last good deployment → ⋯ → *Promote to Production* (instant, no rebuild). Then see docs/RUNBOOK.md for database steps.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue create --title "Deploy failed smoke test: ${ENVIRONMENT} ${SHA:0:7}" --body "$body" --label "deploy-failed" || gh issue create --title "Deploy failed smoke test: ${ENVIRONMENT} ${SHA:0:7}" --body "$body"
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -fsS -X POST -H 'content-type: application/json' --data "{\"text\":\"🚨 Deploy failed smoke test: ${ENVIRONMENT} ${URL} (${SHA:0:7}). Roll back in Vercel → Deployments → Promote the last good one.\"}" "$ALERT_WEBHOOK_URL" || true
          fi
