name: CI

# Every push and pull request: types, lint, formatting, unit + integration tests, a production
# build, and the end-to-end suite against that build. Vercel deploys the same commit when this
# branch is the production branch; see .github/workflows/deploy-smoke.yml for the post-deploy checks.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flagbid
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/flagbid
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  DEMO_MODE: "true"
  # Keep e2e independent of live auction sites.
  LISTING_DIRECT_FETCH: "false"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck, lint, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flagbid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan reads the whole history

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Secret scan (files and full git history)
        run: node scripts/secret-scan.mjs --history

      - name: Dependency audit (fails on unaccepted high or critical advisories)
        run: pnpm audit:deps

      - name: Migrate and seed
        run: pnpm db:deploy && pnpm db:seed

      - name: Every table has row-level security
        run: pnpm db:check-rls

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

      - name: Evaluations (listing reader accuracy and prompt-injection resistance, offline)
        run: pnpm eval

      - name: Build
        run: pnpm build

      - name: Build extension
        run: pnpm extension:build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests (smoke, regression, devices, slow network, offline, accessibility)
        run: pnpm e2e

      - name: Backup and restore round trip (pg_dump must match the server's major version)
        run: |
          bash scripts/ci/install-pg-client.sh 16
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          pnpm exec tsx scripts/db-restore-test.mjs

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  cross-browser:
    name: Smoke tests in Firefox, WebKit and mobile Safari
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flagbid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy && pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Smoke tests in every browser engine
        run: pnpm exec playwright test e2e/smoke.spec.ts --project=firefox --project=webkit --project=mobile-safari
        env:
          E2E_ALL_BROWSERS: "1"
          E2E_DEMO_ADMIN: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cross-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  visual:
    name: Visual regression (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Screenshot baselines are per platform, so this reports differences without blocking the merge.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flagbid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy && pnpm db:seed
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: test-results/
          retention-days: 7
